<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>教师研修 · 自动挂课</title>
<style>
  /* 目标用户是完全不懂技术的人：一列到底、步骤编号、少选项、大字、状态永远可见 */
  :root{
    --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1c1f23; --dim:#6b7280;
    --accent:#2563eb; --accent-d:#1d4ed8; --ok:#15803d; --warn:#b45309; --err:#b91c1c;
    --mono:'Cascadia Mono',Consolas,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 'Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:22px 20px 40px}
  header{margin-bottom:18px}
  h1{margin:0 0 4px;font-size:20px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:13px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;
        padding:16px 18px;margin-bottom:14px}
  .step{display:flex;align-items:baseline;gap:9px;margin:0 0 12px;font-size:15px;font-weight:600}
  .num{flex:none;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;
       font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;
       transform:translateY(2px)}
  .hint{color:var(--dim);font-size:12.5px;font-weight:400}

  select,input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line);
       border-radius:7px;background:#fff;color:inherit}
  select{width:100%;max-width:560px}
  input[type=number]{width:92px}

  .meta{margin-top:10px;display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 11px;font-size:12.5px}
  .chip.gray{background:#f1f3f5;color:var(--dim)}

  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .field{display:flex;align-items:center;gap:8px}
  .field label{color:var(--dim);font-size:13px}

  .list{max-height:290px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-top:1px solid #f0f2f4}
  .item:first-child{border-top:none}
  .item:hover{background:#fafbfc}
  .item input{width:16px;height:16px;flex:none;accent-color:var(--accent)}
  .item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .p{color:var(--dim);font-size:12.5px;flex:none;font-variant-numeric:tabular-nums}
  .item.done .t{color:var(--ok)}
  .item.done .p{color:var(--ok);font-weight:600}
  .toolbar{display:flex;gap:8px;margin-bottom:9px}

  button{font:inherit;padding:9px 17px;border-radius:8px;border:1px solid var(--line);
         background:#fff;color:var(--text);cursor:pointer;white-space:nowrap}
  button:hover:not(:disabled){border-color:#c8cdd4;background:#fcfcfd}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:11px 26px}
  button.primary:hover:not(:disabled){background:var(--accent-d);border-color:var(--accent-d)}
  button.danger{color:var(--err);border-color:#f0c8c8}
  button.small{padding:5px 12px;font-size:13px}

  .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .status{font-size:13px;color:var(--dim)}
  .status b{color:var(--text)}

  #log{background:#12151a;color:#d7dce2;border-radius:8px;padding:12px 14px;
       font:12.5px/1.6 var(--mono);height:250px;overflow:auto;white-space:pre-wrap;
       word-break:break-all;margin:0}
  #log .l-err{color:#fca5a5}
  #log .l-ok{color:#86efac}
  #log .l-cmd{color:#93c5fd}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid #c7cdd4;
        border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;
        vertical-align:-1px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .banner{padding:10px 13px;border-radius:8px;font-size:13px;margin-bottom:14px}
  .banner.warn{background:#fffbeb;border:1px solid #fde68a;color:#7c4a03}
  .banner.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .banner.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>教师研修 · 自动挂课</h1>
    <div class="sub">国家中小学智慧教育平台 —— 登录一次，之后一键挂完</div>
  </header>

  <div id="banner"></div>

  <div class="card">
    <div class="step"><span class="num">1</span>选择专题 <span class="hint" id="siteHint"></span></div>
    <select id="target"></select>
    <div class="meta" id="targetMeta"></div>
  </div>

  <div class="card">
    <div class="step"><span class="num">2</span>选择要挂的课程
      <span class="hint">默认全选，挂满目标学时就会自动停</span></div>
    <div class="toolbar">
      <button class="small" id="all">全选</button>
      <button class="small" id="none">全不选</button>
      <span class="status" id="selInfo" style="margin-left:auto"></span>
    </div>
    <div class="list" id="courses"><div class="item"><span class="t" style="color:#6b7280">正在读取课程列表…</span></div></div>
  </div>

  <div class="card">
    <div class="step"><span class="num">3</span>设置 <span class="hint">不懂就别改，默认就行</span></div>
    <div class="row">
      <div class="field"><label>目标学时</label><input type="number" id="hours" value="10" min="1" max="200" step="0.5"></div>
      <div class="field"><label>播放倍速</label><input type="number" id="rate" value="2" min="1" max="16" step="0.5"></div>
      <div class="field"><label><input type="checkbox" id="headful" style="accent-color:var(--accent)"> 显示浏览器窗口</label></div>
    </div>
  </div>

  <div class="card">
    <div class="step"><span class="num">4</span>开始</div>
    <div class="actions">
      <button class="primary" id="start">开始挂课</button>
      <button id="login">先登录（只需一次）</button>
      <button class="danger" id="stop" disabled>停止</button>
      <span class="status" id="status">就绪</span>
    </div>
  </div>

  <div class="card">
    <div class="step">运行日志</div>
    <pre id="log"></pre>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let sites = [], curSite = null, targets = [], courses = [], lastSeq = 0, running = false;

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = (n) => (n == null ? '—' : (Math.round(n * 100) / 100).toString());

function banner(kind, html) {
  $('banner').innerHTML = html ? `<div class="banner ${kind}">${html}</div>` : '';
}

function addLine(l) {
  const el = document.createElement('div');
  el.className = 'l-' + (l.kind || 'out');
  el.textContent = l.text;
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
}

async function api(path, opt) {
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

// ── 载入 ──────────────────────────────────────────────
async function boot() {
  sites = (await api('/api/sites')).sites;
  curSite = sites[0].id;
  $('siteHint').textContent = sites.length > 1 ? '' : (sites[0].name + ' · ' + sites[0].hint);
  await loadTargets();
  const st = await api('/api/status');
  for (const l of st.lines) addLine(l);
  lastSeq = st.seq;
  setRunning(st.running);
  if (st.running) banner('warn', '检测到已有一批挂课正在运行（可能是上次没关掉的）。');
}

async function loadTargets() {
  $('targetMeta').innerHTML = '<span class="chip gray">正在读取…</span>';
  const r = await api('/api/targets?site=' + encodeURIComponent(curSite));
  targets = r.targets;
  $('target').innerHTML = targets.map((t) =>
    `<option value="${t.id}"${t.available ? '' : ' disabled'}>` +
    `${t.available ? (t.title || t.id) : (t.id + '（暂时读不到，可能已结束）')}</option>`).join('');
  const first = targets.find((t) => t.available);
  if (first) {
    $('target').value = first.id;
    if (first.maxPeriod) $('hours').value = first.maxPeriod;
  }
  showMeta();
  await loadCourses();
}

function showMeta() {
  const t = targets.find((x) => x.id === $('target').value);
  if (!t) return $('targetMeta').innerHTML = '';
  const chips = [];
  if (t.available) {
    chips.push(`<span class="chip">${t.courseIds.length} 门课</span>`);
    if (t.maxPeriod) chips.push(`<span class="chip">目标 ${t.maxPeriod} 学时</span>`);
    if (t.studyEnd) chips.push(`<span class="chip">截止 ${String(t.studyEnd).slice(0, 10)}</span>`);
    if (t.phaseTitles.length) chips.push(`<span class="chip gray">${t.phaseTitles.join(' / ')}</span>`);
  } else {
    chips.push(`<span class="chip gray">读取失败：${t.error || ''}</span>`);
  }
  $('targetMeta').innerHTML = chips.join('');
}

async function loadCourses() {
  const t = $('target').value;
  $('courses').innerHTML = '<div class="item"><span class="t" style="color:#6b7280">正在读取课程列表…</span></div>';
  try {
    const r = await api(`/api/courses?site=${encodeURIComponent(curSite)}&target=${encodeURIComponent(t)}`);
    courses = r.courses;
    renderCourses();
  } catch (e) {
    courses = [];
    $('courses').innerHTML = `<div class="item"><span class="t" style="color:#b91c1c">读取课程失败：${esc(e.message)}</span></div>`;
  }
}

function renderCourses() {
  $('courses').innerHTML = courses.map((c, i) => {
    const cap = Number(c.maxPeriod);
    const per = c.totalPeriod != null ? `${fmt(c.totalPeriod)} 学时` : '';
    const tag = cap > 0 ? `可计入 ${cap}` : '不限';
    return `<label class="item" data-i="${i}">
      <input type="checkbox" checked data-id="${c.courseId}">
      <span class="t">${esc(c.title)}</span>
      <span class="p">${per} · ${tag}</span></label>`;
  }).join('');
  $('courses').querySelectorAll('input[type=checkbox]')
    .forEach((cb) => cb.addEventListener('change', updateSel));
  updateSel();
}

function updateSel() {
  const boxes = [...$('courses').querySelectorAll('input[type=checkbox]')];
  const n = boxes.filter((b) => b.checked).length;
  const sec = courses.filter((c, i) => boxes[i] && boxes[i].checked)
    .reduce((a, c) => a + (Number(c.totalPeriod) || 0), 0);
  $('selInfo').textContent = boxes.length ? `已选 ${n} / ${boxes.length} 门 · 合计 ${fmt(sec)} 学时` : '';
}

function setRunning(on) {
  running = on;
  $('start').disabled = on;
  $('login').disabled = on;
  $('stop').disabled = !on;
  $('status').innerHTML = on ? '<span class="spin"></span>挂课中…' : (running === false ? '就绪' : '');
}

// ── 操作 ──────────────────────────────────────────────
$('all').onclick = () => { $('courses').querySelectorAll('input[type=checkbox]').forEach((b) => (b.checked = true)); updateSel(); };
$('none').onclick = () => { $('courses').querySelectorAll('input[type=checkbox]').forEach((b) => (b.checked = false)); updateSel(); };
$('target').onchange = () => { showMeta(); loadCourses(); };

$('start').onclick = async () => {
  const picked = [...$('courses').querySelectorAll('input[type=checkbox]')].filter((b) => b.checked).map((b) => b.dataset.id);
  if (!picked.length) return banner('err', '请至少勾选一门课程。');
  if (picked.length < courses.length) {
    const t = targets.find((x) => x.id === $('target').value);
    if (t && t.courseIds.length && picked.length < t.courseIds.length) {
      banner('warn', `只勾选了 ${picked.length} 门课。如果目标学时凑不够，平台不会认定满 —— 建议全选。`);
    }
  } else banner('', '');
  try {
    setRunning(true);
    $('log').innerHTML = ''; lastSeq = 0;
    await api('/api/start', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        site: curSite, target: $('target').value, courses: picked,
        targetHours: Number($('hours').value), rate: Number($('rate').value),
        headful: $('headful').checked,
      }),
    });
  } catch (e) { setRunning(false); banner('err', '启动失败：' + esc(e.message)); }
};

$('login').onclick = async () => {
  try {
    setRunning(true);
    banner('warn', '已打开登录窗口 —— 请在里面用手机扫码或输入账号密码登录。<b>登录成功后会自己继续，不用回来点任何东西。</b>（只需做这一次，以后会自动记住）');
    await api('/api/start', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ site: curSite, target: '__login__', login: true, headful: true }),
    });
  } catch (e) { setRunning(false); banner('err', '打开登录窗口失败：' + esc(e.message)); }
};

$('stop').onclick = async () => {
  banner('', '');
  try { await api('/api/stop', { method: 'POST' }); } catch (e) { banner('err', esc(e.message)); }
};

// ── 日志 SSE ──────────────────────────────────────────
function attachLog() {
  const es = new EventSource('/api/log?after=' + lastSeq);
  es.onmessage = (ev) => {
    const l = JSON.parse(ev.data);
    if (l.seq <= lastSeq) return;
    lastSeq = l.seq;
    addLine(l);
    if (l.text.includes('已正常结束')) { setRunning(false); banner('ok', '✅ 挂完了。可以关掉这个窗口。'); }
    else if (l.text.startsWith('⚠️')) { setRunning(false); banner('warn', esc(l.text)); }
    else if (l.text.includes('环境不满足')) { setRunning(false); banner('err', esc(l.text) + '　请按日志里的提示处理后重开。'); }
  };
  es.onerror = () => { es.close(); setTimeout(attachLog, 2500); };
}

boot().catch((e) => banner('err', '初始化失败：' + esc(e.message)));
attachLog();
</script>
</body>
</html>
